# dev: http://127.0.0.1:${DEV_PORT} (default 8081), data in ./data/dev, every crawl is a dry run, ./app reloads on save.
# Control with ./server.sh dev ...
name: torrent_web_scraper-dev
services:
  scraper:
    image: torrent-web-scraper:dev
    network_mode: host
    dns: 8.8.8.8
    volumes:
      - ./data/dev:/data
      - ./app:/app/app
    env_file: .env
    environment:
      APP_ENV: dev
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "${DEV_PORT:-8081}", "--reload", "--reload-dir", "app"]
    init: true
    shm_size: 1gb
